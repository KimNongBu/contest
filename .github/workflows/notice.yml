name: 공지사항 알림

on:
  schedule:
    - cron: "32 * * * *"  # 매시간 41분 (UTC 기준이지만 매시간이라 한국 시간도 같음)
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼
    inputs:
      test:
        description: "디스코드 연결 테스트 메시지 보내기"
        type: boolean
        default: false

permissions:
  contents: write          # seen.json 저장용

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: 새 공지 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MESSAGE: ${{ inputs.test }}
        run: python scraper.py

      - name: 확인한 글 목록 저장
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen posts"
          git push
